name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel migrations in progress

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - run: npm ci
      
      - name: Generate Prisma Client
        run: npm --workspace @doewe/web run prisma:generate
      
      - name: Run Migrations on Production
        run: npm --workspace @doewe/web run prisma:migrate:deploy
        env:
          # IMPORTANT: secrets.DATABASE_URL must be the PUBLIC proxy URL
          # (e.g. shortline.proxy.rlwy.net:PORT) — GitHub runners live outside
          # Railway's private network and cannot reach postgres.railway.internal.
          # Keep this secret in sync with the Postgres password: if Railway rotates
          # it, update the secret (gh secret set DATABASE_URL) or this job fails
          # with P1000 (auth failed) and Railway's CI-gated deploy is SKIPPED.
          # Alternative: move migrations to a Railway Pre-Deploy Command
          # (Settings → Deploy → Pre-Deploy Command:
          #   npm --workspace @doewe/web run prisma:migrate:deploy)
          # which runs inside Railway's network using the internal DATABASE_URL
          # reference and removes the need for this GitHub secret entirely.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Add your deployment steps here (e.g., Vercel, Railway, etc.)
  # The deployment should happen AFTER migrations complete
  # deploy:
  #   name: Deploy Application
  #   runs-on: ubuntu-latest
  #   needs: [migrate]
  #   steps:
  #     - ... your deployment steps
